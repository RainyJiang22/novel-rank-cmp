# Include inside the existing HTTPS server block. Zones are declared in nginx-limits.conf.
location = /novelrank {
    auth_basic off;
    limit_req zone=novelrank_requests burst=10 nodelay;
    limit_conn novelrank_connections 8;
    return 308 /novelrank/;
}

location ^~ /novelrank/ {
    auth_basic off;
    # Override inherited zones so NovelRank traffic never consumes another service's counters.
    limit_req zone=novelrank_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn novelrank_connections 8;
    limit_conn_status 429;
    client_max_body_size 16k;
    access_log /var/log/novelrank/nginx-access.log combined;
    error_log /var/log/novelrank/nginx-error.log warn;
    proxy_pass http://127.0.0.1:18766/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_read_timeout 55s;
    proxy_send_timeout 15s;
}
